<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>An Nhiên - Ứng Dụng Đặt Tên Con Ý Nghĩa & Phong Thủy Việt Nam</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fffbeb',
                            100: '#fef3c7',
                            200: '#fde68a',
                            500: '#d97706',
                            600: '#b45309',
                            700: '#92400e',
                            800: '#78350f',
                        },
                        jade: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        },
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    },
                    fontFamily: {
                        sans: ['Be Vietnam Pro', 'Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'Merriweather', 'serif']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- React & Babel Core -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #fcfbf7;
        }
        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }
        .pattern-bg {
            background-color: #fdfbf7;
            background-image: radial-gradient(#e5e7eb 0.75px, transparent 0.75px), radial-gradient(#e5e7eb 0.75px, #fdfbf7 0.75px);
            background-size: 30px 30px;
            background-position: 0 0,15px 15px;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="pattern-bg text-slate-800 antialiased min-h-screen flex flex-col">
    <div id="root" class="flex-grow flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Constants and Year Element Mapping for Vietnamese Feng Shui
        const YEAR_ELEMENTS = {
            2024: { canChi: "Giáp Thìn", mệnh: "Hỏa (Phú Đăng Hỏa)", icon: "🔥", recommend: "Mộc, Thổ" },
            2025: { canChi: "Ất Tỵ", mệnh: "Hỏa (Phú Đăng Hỏa)", icon: "🔥", recommend: "Mộc, Thổ" },
            2026: { canChi: "Bính Ngọ", mệnh: "Thủy (Thiên Hà Thủy)", icon: "🌊", recommend: "Kim, Mộc" },
            2027: { canChi: "Đinh Mùi", mệnh: "Thủy (Thiên Hà Thủy)", icon: "🌊", recommend: "Kim, Mộc" },
            2028: { canChi: "Mậu Thân", mệnh: "Thổ (Đại Trạch Thổ)", icon: "🏔️", recommend: "Hỏa, Kim" },
            2029: { canChi: "Kỷ Dậu", mệnh: "Thổ (Đại Trạch Thổ)", icon: "🏔️", recommend: "Hỏa, Kim" },
            2030: { canChi: "Canh Tuất", mệnh: "Kim (Thoa Xuyến Kim)", icon: "⚔️", recommend: "Thổ, Thủy" }
        };

        const DESIRE_TAGS = [
            "Bình An & May Mắn", "Trí Tuệ & Thông Minh", "Chí Lớn & Thành Công",
            "Nghệ Thuật & Tài Hoa", "Nhân Ái & Hiếu Thảo", "Kiên Cường & Tự Lập",
            "Yêu Thiên Nhiên", "Nét Đẹp Đoan Trang", "Tài Lộc & Phú Quý", "Gắn Kết Gia Đình"
        ];

        // Main App Component
        function App() {
            // State variables
            const [activeTab, setActiveTab] = useState('generator'); // 'generator', 'saved', 'library', 'chat', 'compare'
            const [gender, setGender] = useState('boy'); // 'boy', 'girl', 'unspecified'
            const [fatherName, setFatherName] = useState('Nguyễn Văn Hải');
            const [motherName, setMotherName] = useState('Trần Thị Mai');
            const [birthYear, setBirthYear] = useState('2026');
            const [selectedDesires, setSelectedDesires] = useState(["Bình An & May Mắn", "Trí Tuệ & Thông Minh"]);
            const [customWish, setCustomWish] = useState('');
            const [nameLength, setNameLength] = useState('3_or_4'); // '3', '4', '3_or_4'
            const [combineBothSurnames, setCombineBothSurnames] = useState(true);
            const [firstLetterPref, setFirstLetterPref] = useState('');

            // AI Generation States
            const [isLoading, setIsLoading] = useState(false);
            const [generatedNames, setGeneratedNames] = useState([]);
            const [errorMsg, setErrorMsg] = useState('');
            const [savedNames, setSavedNames] = useState([]);
            const [selectedDetailName, setSelectedDetailName] = useState(null);
            const [compareList, setCompareList] = useState([]);

            // Chat Assistant States
            const [chatMessages, setChatMessages] = useState([
                {
                    sender: 'bot',
                    text: 'Xin chào cha mẹ! Tôi là Trợ Lý Đặt Tên An Nhiên. Cha mẹ có thắc mắc gì về tên gọi, phong thủy hay cách kết hợp tên cha mẹ cho bé không ạ?'
                }
            ]);
            const [chatInput, setChatInput] = useState('');
            const [isChatLoading, setIsChatLoading] = useState(false);

            // Load saved names from localStorage
            useEffect(() => {
                const stored = localStorage.getItem('annhien_saved_names');
                if (stored) {
                    try { setSavedNames(JSON.parse(stored)); } catch(e){}
                }
            }, []);

            // Save names sync
            const toggleSaveName = (nameObj) => {
                let updated;
                const exists = savedNames.some(item => item.fullName === nameObj.fullName);
                if (exists) {
                    updated = savedNames.filter(item => item.fullName !== nameObj.fullName);
                } else {
                    updated = [...savedNames, { ...nameObj, savedAt: new Date().toISOString() }];
                }
                setSavedNames(updated);
                localStorage.setItem('annhien_saved_names', JSON.stringify(updated));
            };

            const toggleCompareName = (nameObj) => {
                const exists = compareList.some(item => item.fullName === nameObj.fullName);
                if (exists) {
                    setCompareList(compareList.filter(item => item.fullName !== nameObj.fullName));
                } else {
                    if (compareList.length >= 3) {
                        alert("Cha mẹ chỉ nên chọn tối đa 3 tên để so sánh chi tiết cùng lúc.");
                        return;
                    }
                    setCompareList([...compareList, nameObj]);
                }
            };

            const handleTagToggle = (tag) => {
                if (selectedDesires.includes(tag)) {
                    setSelectedDesires(selectedDesires.filter(t => t !== tag));
                } else {
                    setSelectedDesires([...selectedDesires, tag]);
                }
            };

            // Gemini API Integration for Generating Names
            const generateNamesWithGemini = async () => {
                setIsLoading(true);
                setErrorMsg('');

                const yearInfo = YEAR_ELEMENTS[birthYear] || { canChi: birthYear, mệnh: "Chưa rõ" };

                // System Prompt setup
                const systemPrompt = `Bạn là một chuyên gia hàng đầu về văn hóa Việt Nam, ngôn ngữ Hán-Việt, và phong thủy đăt tên con.
Nhiệm vụ của bạn là tư vấn danh sách các tên hay, sâu sắc, đúng phong thủy và thanh âm hài hòa cho bé.
Đầu ra BẮT BUỘC phải là một mảng JSON nguyên bản chứa các đối tượng tên (KHÔNG kèm bất kỳ định dạng markdown hay văn bản ngoài JSON).`;

                const userPrompt = `Hãy gợi ý 6 tên tiếng Việt tuyệt đẹp cho em bé với thông tin chi tiết sau:
- Giới tính em bé: ${gender === 'boy' ? 'Bé Trai' : gender === 'girl' ? 'Bé Gái' : 'Chưa xác định'}
- Họ tên Cha: ${fatherName || 'Không nhập'}
- Họ tên Mẹ: ${motherName || 'Không nhập'}
- Năm sinh dự kiến: ${birthYear} (${yearInfo.canChi} - Mệnh ${yearInfo.mệnh})
- Mong muốn của cha mẹ về ý nghĩa: ${selectedDesires.join(', ')}. ${customWish ? `Ghi chú thêm: ${customWish}` : ''}
- Yêu cầu số từ: ${nameLength === '3' ? 'Đúng 3 từ' : nameLength === '4' ? 'Đúng 4 từ' : 'Linh hoạt 3 hoặc 4 từ'}
- Ghép cả họ cha và họ mẹ: ${combineBothSurnames ? 'Nên ghép cả họ cha và họ mẹ (Ví dụ: Nguyễn Trần...)' : 'Theo họ cha chính'}
${firstLetterPref ? `- Chữ cái bắt đầu tên chính mong muốn: ${firstLetterPref}` : ''}

Hãy trả về định dạng JSON thuần túy theo cấu trúc Schema sau:
[
  {
    "fullName": "Nguyễn Trần Bảo An",
    "surname": "Nguyễn Trần",
    "middleName": "Bảo",
    "firstName": "An",
    "hanViet": "安 - Bình an, yên ổn, tâm hồn thư thái",
    "meaning": "Báu vật bình an của cha mẹ. Mong con đời đời an yên, gặp nhiều may mắn và được mọi người yêu quý.",
    "parentHarmony": "Sự kết hợp hoàn hảo giữa họ Nguyễn của Cha và họ Trần của Mẹ. Âm tiết chuyển tiếp mượt mà.",
    "fengShuiScore": 96,
    "element": "Thủy",
    "toneBalance": "Bằng - Bằng - Trắc - Bằng (Rất êm tai)",
    "tags": ["Bình An", "May Mắn", "Họ Cha Mẹ"],
    "personalityWish": "Tâm trí sáng suốt, hòa nhã, sống có tình có nghĩa"
  }
]`;

                const apiKey = ""; // API key managed automatically by runtime if available
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                };

                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }

                    const data = await response.json();
                    const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (jsonText) {
                        const parsedData = JSON.parse(jsonText);
                        setGeneratedNames(parsedData);
                    } else {
                        throw new Error("Không nhận được dữ liệu hợp lệ từ AI.");
                    }
                } catch (err) {
                    console.error("Gemini API Error, fallback applied:", err);
                    // Smart Offline Fallback Generator if network/API unavailable
                    generateFallbackNames();
                } finally {
                    setIsLoading(false);
                }
            };

            // Fallback algorithm providing high-quality Vietnamese names
            const generateFallbackNames = () => {
                const fSurname = fatherName.trim().split(' ')[0] || 'Nguyễn';
                const mSurname = motherName.trim().split(' ')[0] || 'Trần';

                const yearObj = YEAR_ELEMENTS[birthYear] || YEAR_ELEMENTS[2026];

                const boyNames = [
                    { mid: "Minh", first: "Triết", han: "明 哲", mean: "Con là người trí tuệ sáng suốt, thấu đáo và minh triết.", element: "Mộc", tags: ["Trí Tuệ", "Thành Công"] },
                    { mid: "Bảo", first: "An", han: "寶 安", mean: "Báu vật quý giá của gia đình, mong con luôn bình an, thư thái.", element: "Thủy", tags: ["Bình An", "May Mắn"] },
                    { mid: "Gia", first: "Hưng", han: "家 興", mean: "Người con làm hưng thịnh gia đường, đem lại tự hào cho dòng họ.", element: "Thổ", tags: ["Phú Quý", "Gia Đình"] },
                    { mid: "Đăng", first: "Khoa", han: "燈 科", mean: "Ngọn đèn đỗ đạt, đỗ thủ khoa, đường học vấn hanh thông.", element: "Hỏa", tags: ["Trí Tuệ", "Chí Lớn"] },
                    { mid: "Khôi", first: "Nguyên", han: "魁 元", mean: "Tài năng kiệt xuất, đứng đầu, tuấn tú và đàng hoàng.", element: "Mộc", tags: ["Tài Hoa", "Kiên Cường"] },
                    { mid: "Đức", first: "Nhân", han: "德 仁", mean: "Sống có đức độ, lòng nhân ái bao la, gieo điều lành gặp quả ngọt.", element: "Hỏa", tags: ["Nhân Ái", "Bình An"] }
                ];

                const girlNames = [
                    { mid: "Tường", first: "Vy", han: "祥 薇", mean: "Đóa hoa tường vi dịu dàng, mang lại điềm lành và hạnh phúc.", element: "Mộc", tags: ["Đoan Trang", "May Mắn"] },
                    { mid: "Nhiên", first: "An", han: "然 安", mean: "Sống tự nhiên, tự tại, tâm hồn luôn thong dong và bình an.", element: "Thủy", tags: ["Bình An", "Thiên Nhiên"] },
                    { mid: "Ngọc", first: "Khuê", han: "玉 閨", mean: "Viên ngọc quý chốn khuê các, cao sang, thuần khiết.", element: "Kim", tags: ["Đoan Trang", "Phú Quý"] },
                    { mid: "Tuệ", first: "Linh", han: "智慧 靈", mean: "Trí tuệ tinh anh, tâm hồn linh hoạt và thông minh lanh lợi.", element: "Hỏa", tags: ["Trí Tuệ", "Tài Hoa"] },
                    { mid: "Bảo", first: "Quyên", han: "寶 娟", mean: "Loài chim quyên quý giá, thanh cao, tính cách dịu dàng.", element: "Mộc", tags: ["Nghệ Thuật", "Nhân Ái"] },
                    { mid: "Thùy", first: "Dương", han: "垂 陽", mean: "Cây dại ven biển kiên cường, như ánh mặt trời ấm áp.", element: "Thổ", tags: ["Kiên Cường", "Tự Lập"] }
                ];

                const pool = gender === 'boy' ? boyNames : girlNames;

                const fallbackList = pool.map((item, idx) => {
                    const fullSurname = combineBothSurnames ? `${fSurname} ${mSurname}` : fSurname;
                    const fullName = `${fullSurname} ${item.mid} ${item.first}`;
                    return {
                        fullName: fullName,
                        surname: fullSurname,
                        middleName: item.mid,
                        firstName: item.first,
                        hanViet: item.han,
                        meaning: item.mean,
                        parentHarmony: `Tên ghép từ họ ${fSurname} (Cha) và ${mSurname} (Mẹ), tạo vần điệu trầm bổng tự nhiên.`,
                        fengShuiScore: 92 + (idx % 7),
                        element: item.element,
                        toneBalance: "Thanh bằng trắc hài hòa, không trùng âm lặp từ",
                        tags: [...item.tags, combineBothSurnames ? "Họ Cha Mẹ" : "Họ Cha"],
                        personalityWish: "Hiếu thảo, tự tin, mang lại niềm vui cho cả nhà."
                    };
                });

                setGeneratedNames(fallbackList);
            };

            // Handle AI Consultation Chatbot
            const sendChatMessage = async () => {
                if (!chatInput.trim()) return;

                const userText = chatInput;
                const updatedMessages = [...chatMessages, { sender: 'user', text: userText }];
                setChatMessages(updatedMessages);
                setChatInput('');
                setIsChatLoading(true);

                const systemPrompt = `Bạn là chuyên gia tư vấn đặt tên em bé Việt Nam am hiểu phong thủy, Hán-Việt, và âm điệu tiếng Việt. Hãy tư vấn ngắn gọn, chân thành, sâu sắc và lịch sự.`;

                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                const payload = {
                    contents: [
                        { parts: [{ text: `Bối cảnh: Cha là ${fatherName}, Mẹ là ${motherName}, Con sinh năm ${birthYear}.\nCâu hỏi của phụ huynh: ${userText}` }] }
                    ],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                try {
                    const res = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await res.json();
                    const botReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Xin lỗi, tôi gặp chút gián đoạn. Cha mẹ có thể thử hỏi lại nhé!";
                    setChatMessages([...updatedMessages, { sender: 'bot', text: botReply }]);
                } catch (e) {
                    setChatMessages([...updatedMessages, {
                        sender: 'bot',
                        text: 'Tên Việt Nam mang rất nhiều ý nghĩa cao đẹp. Ví dụ: Nguyễn Trần Bình An biểu hiện sự kết hợp hai dòng họ và ước mong cuộc sống con được bình yên, suôn sẻ.'
                    }]);
                } finally {
                    setIsChatLoading(false);
                }
            };

            // Audio Speech synth function
            const speakName = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'vi-VN';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                } else {
                    alert("Trình duyệt của bạn không hỗ trợ đọc âm thanh tự động.");
                }
            };

            return (
                <div className="flex-grow flex flex-col min-h-screen">
                    {/* Top Navigation Bar */}
                    <header className="bg-white/90 backdrop-blur-md border-b border-amber-100 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
                            <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setActiveTab('generator')}>
                                <div className="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 to-rose-400 flex items-center justify-center text-white shadow-md">
                                    <i className="fa-solid font-bold text-xl fa-child-reaching"></i>
                                </div>
                                <div>
                                    <h1 className="font-serif-title font-bold text-xl text-amber-900 leading-none">An Nhiên</h1>
                                    <p className="text-xs text-amber-700/80 font-medium mt-0.5">Đặt Tên Con Ý Nghĩa & Phong Thủy</p>
                                </div>
                            </div>

                            {/* Tabs */}
                            <nav className="flex items-center space-x-1 sm:space-x-2 text-sm font-medium overflow-x-auto pb-1 sm:pb-0">
                                <button
                                    onClick={() => setActiveTab('generator')}
                                    className={`px-3 py-2 rounded-xl transition-all flex items-center space-x-1.5 whitespace-nowrap ${activeTab === 'generator' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:bg-amber-50'}`}
                                >
                                    <i className="fa-solid fa-wand-magic-sparkles"></i>
                                    <span>Đặt Tên AI</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('saved')}
                                    className={`px-3 py-2 rounded-xl transition-all flex items-center space-x-1.5 whitespace-nowrap relative ${activeTab === 'saved' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:bg-amber-50'}`}
                                >
                                    <i className="fa-solid fa-bookmark"></i>
                                    <span>Tên Đã Lưu</span>
                                    {savedNames.length > 0 && (
                                        <span className={`ml-1 text-xs px-1.5 py-0.5 rounded-full ${activeTab === 'saved' ? 'bg-white text-amber-700' : 'bg-amber-200 text-amber-800'}`}>
                                            {savedNames.length}
                                        </span>
                                    )}
                                </button>
                                <button
                                    onClick={() => setActiveTab('compare')}
                                    className={`px-3 py-2 rounded-xl transition-all flex items-center space-x-1.5 whitespace-nowrap ${activeTab === 'compare' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:bg-amber-50'}`}
                                >
                                    <i className="fa-solid fa-scale-balanced"></i>
                                    <span>So Sánh ({compareList.length})</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('library')}
                                    className={`px-3 py-2 rounded-xl transition-all flex items-center space-x-1.5 whitespace-nowrap ${activeTab === 'library' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:bg-amber-50'}`}
                                >
                                    <i className="fa-solid fa-book-open"></i>
                                    <span>Thư Viện Tên</span>
                                </button>
                                <button
                                    onClick={() => setActiveTab('chat')}
                                    className={`px-3 py-2 rounded-xl transition-all flex items-center space-x-1.5 whitespace-nowrap ${activeTab === 'chat' ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-600 hover:bg-amber-50'}`}
                                >
                                    <i className="fa-solid fa-comments"></i>
                                    <span>Trợ Lý Hỏi Đáp</span>
                                </button>
                            </nav>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-grow max-w-6xl w-full mx-auto px-4 py-6">

                        {/* TAB 1: NAME GENERATOR WIZARD */}
                        {activeTab === 'generator' && (
                            <div className="space-y-8">
                                {/* Hero Banner */}

                            </div>
                        )}

                        {/* TAB 4: NAME LIBRARY */}
                        {activeTab === 'library' && (
                            <div className="space-y-6">
                                <div>
                                    <h2 className="font-serif-title font-bold text-2xl text-slate-800">
                                        Thư Viện Tên Đẹp Tiếng Việt
                                    </h2>
                                    <p className="text-xs text-slate-500 mt-1">
                                        Tuyển tập những tên hay truyền thống và hiện đại phân loại theo chủ đề.
                                    </p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {/* Category 1: Boy Names */}
                                    <div className="bg-white rounded-3xl p-6 border border-amber-100 shadow-sm space-y-4">
                                        <div className="flex items-center space-x-2 border-b border-slate-100 pb-3">
                                            <span className="text-2xl">👦</span>
                                            <h3 className="font-serif-title font-bold text-lg text-slate-800">Tên Bé Trai Chí Lớn & Trí Tuệ</h3>
                                        </div>
                                        <div className="space-y-2 text-xs">
                                            <div className="p-3 bg-slate-50 rounded-xl">
                                                <div className="font-bold text-amber-900">Minh Triết - 明哲</div>
                                                <div className="text-slate-600 mt-0.5">Trí tuệ sáng suốt, hiểu biết sâu rộng, tâm thế đàng hoàng.</div>
                                            </div>
                                            <div className="p-3 bg-slate-50 rounded-xl">
                                                <div className="font-bold text-amber-900">Đăng Khoa - 燈科</div>
                                                <div className="text-slate-600 mt-0.5">Ngọn đèn soi sáng đường học vấn, đỗ đạt tài cao.</div>
                                            </div>
                                            <div className="p-3 bg-slate-50 rounded-xl">
                                                <div className="font-bold text-amber-900">Bảo Khang - 寶康</div>
                                                <div className="text-slate-600 mt-0.5">Báu vật mang lại sức khỏe, an khang, phú quý cho gia đình.</div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Category 2: Girl Names */}
                                    <div className="bg-white rounded-3xl p-6 border border-amber-100 shadow-sm space-y-4">
                                        <div className="flex items-center space-x-2 border-b border-slate-100 pb-3">
                                            <span className="text-2xl">👧</span>
                                            <h3 className="font-serif-title font-bold text-lg text-slate-800">Tên Bé Gái Đoan Trang & An Nhiên</h3>
                                        </div>
                                        <div className="space-y-2 text-xs">
                                            <div className="p-3 bg-slate-50 rounded-xl">
                                                <div className="font-bold text-amber-900">Tuệ Lâm - 智慧林</div>
                                                <div className="text-slate-600 mt-0.5">Rừng trí tuệ bao la, vừa thông minh vừa đằm thắm.</div>
                                            </div>
                                            <div className="p-3 bg-slate-50 rounded-xl">
                                                <div className="font-bold text-amber-900">Bảo An - 寶安</div>
                                                <div className="text-slate-600 mt-0.5">Cuộc sống đời đời bình an, được bảo bọc và yêu thương.</div>
                                            </div>
                                            <div className="p-3 bg-slate-50 rounded-xl">
                                                <div className="font-bold text-amber-900">Tường Vy - 祥薇</div>
                                                <div className="text-slate-600 mt-0.5">Hoa tường vi nhỏ nhắn, mang đến cát tường và niềm vui.</div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* TAB 5: AI CONSULTATION CHAT */}
                        {activeTab === 'chat' && (
                            <div className="bg-white rounded-3xl border border-amber-100 shadow-sm overflow-hidden flex flex-col h-[600px]">
                                {/* Chat Header */}
                                <div className="bg-gradient-to-r from-amber-500 to-rose-400 p-4 text-white flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <div className="w-9 h-9 rounded-full bg-white/20 flex items-center justify-center text-lg">
                                            <i className="fa-solid fa-robot"></i>
                                        </div>
                                        <div>
                                            <h3 className="font-bold font-serif-title text-base">Trợ Lý Đặt Tên Phong Thủy AI</h3>
                                            <p className="text-[11px] text-amber-100">Giải đáp mọi thắc mắc về tên gọi, vần điệu & ngũ hành</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Chat Messages Box */}
                                <div className="flex-grow p-4 overflow-y-auto space-y-3 bg-slate-50/50">
                                    {chatMessages.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] p-3.5 rounded-2xl text-xs leading-relaxed ${msg.sender === 'user' ? 'bg-amber-500 text-white rounded-br-none' : 'bg-white text-slate-700 border border-slate-200/80 rounded-bl-none shadow-sm'}`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    {isChatLoading && (
                                        <div className="flex justify-start">
                                            <div className="bg-white p-3 rounded-2xl text-xs text-slate-400 flex items-center space-x-2 border border-slate-200">
                                                <i className="fa-solid fa-spinner fa-spin"></i>
                                                <span>AI đang suy ngẫm câu trả lời...</span>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                {/* Chat Input Bar */}
                                <div className="p-3 bg-white border-t border-slate-100 flex items-center space-x-2">
                                    <input
                                        type="text"
                                        value={chatInput}
                                        onChange={(e) => setChatInput(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && sendChatMessage()}
                                        placeholder="Hỏi về tên, tên lót hợp họ cha mẹ, phong thủy..."
                                        className="flex-grow px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-500/50 text-xs"
                                    />
                                    <button
                                        onClick={sendChatMessage}
                                        disabled={isChatLoading || !chatInput.trim()}
                                        className="px-4 py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-xl text-xs font-bold transition-all disabled:opacity-50"
                                    >
                                        <i className="fa-solid fa-paper-plane mr-1"></i> Gửi
                                    </button>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* DETAIL MODAL */}
                    {selectedDetailName && (
                        <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-5 shadow-2xl relative animate-in fade-in zoom-in duration-200">
                                <button
                                    onClick={() => setSelectedDetailName(null)}
                                    className="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 flex items-center justify-center text-sm"
                                >
                                    <i className="fa-solid fa-xmark"></i>
                                </button>

                                <div>
                                    <span className="text-xs font-bold uppercase tracking-wider text-amber-600">Phân Tích Chi Tiết Tên Gọi</span>
                                    <h3 className="font-serif-title font-bold text-2xl text-slate-800 mt-1">
                                        {selectedDetailName.fullName}
                                    </h3>
                                    <p className="text-xs text-slate-500">Hán - Việt: <span className="font-semibold text-slate-700">{selectedDetailName.hanViet}</span></p>
                                </div>

                                <div className="space-y-3 text-xs bg-amber-50/60 p-4 rounded-2xl border border-amber-100">
                                    <div>
                                        <span className="font-bold text-amber-900">Ý Nghĩa Sâu Sắc:</span>
                                        <p className="text-slate-700 mt-0.5 leading-relaxed">{selectedDetailName.meaning}</p>
                                    </div>
                                    <div>
                                        <span className="font-bold text-amber-900">Ước Nguyện Cho Bé:</span>
                                        <p className="text-slate-700 mt-0.5">{selectedDetailName.personalityWish || 'Sống an nhiên, thành công và luôn là niềm tự hào của cha mẹ.'}</p>
                                    </div>
                                </div>

                                <div className="grid grid-cols-2 gap-3 text-xs">
                                    <div className="p-3 bg-slate-50 rounded-xl">
                                        <span className="text-slate-400 block font-medium">Ngũ Hành Tên</span>
                                        <span className="font-bold text-slate-800 text-sm">{selectedDetailName.element}</span>
                                    </div>
                                    <div className="p-3 bg-slate-50 rounded-xl">
                                        <span className="text-slate-400 block font-medium">Điểm Cát Tường</span>
                                        <span className="font-bold text-amber-600 text-sm">{selectedDetailName.fengShuiScore} / 100</span>
                                    </div>
                                </div>

                                <div>
                                    <span className="text-xs font-bold text-slate-600 block mb-1">Thanh Âm & Vần Điệu</span>
                                    <p className="text-xs text-slate-600 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                        {selectedDetailName.toneBalance}
                                    </p>
                                </div>

                                <div className="pt-2 flex items-center justify-end space-x-2">
                                    <button
                                        onClick={() => speakName(selectedDetailName.fullName)}
                                        className="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold"
                                    >
                                        <i className="fa-solid fa-volume-high mr-1"></i> Phát âm
                                    </button>
                                    <button
                                        onClick={() => {
                                            toggleSaveName(selectedDetailName);
                                            setSelectedDetailName(null);
                                        }}
                                        className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold shadow-sm"
                                    >
                                        Lưu Tên Này
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer className="bg-white border-t border-amber-100/60 py-6 mt-12 text-center text-xs text-slate-400">
                        <div className="max-w-6xl mx-auto px-4 space-y-2">
                            <p className="font-serif-title text-sm font-bold text-amber-900">
                                An Nhiên - Đồng Hành Cùng Cha Mẹ Việt
                            </p>
                            <p>© 2026 An Nhiên Naming Application. Tôn vinh nét đẹp văn hóa & tiếng Việt.</p>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render the application
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
